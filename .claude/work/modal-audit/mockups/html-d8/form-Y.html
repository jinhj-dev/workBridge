<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --primary-100:#1e5eff;--primary-90:#336dff;--primary-60:#89abff;--primary-30:#ecf2ff;
  --g100:#131523;--g80:#5a607f;--g70:#7e84a3;--g60:#a1a7c4;--g50:#d7dbec;--g40:#e6e9f4;--g30:#f5f6fa;
  --danger-100:#f0142f;--danger-30:#fde7ea;
  --warning-30:#fff1e0;--warning-110:#b45309;
  --success-30:#e6f7ee;--success-110:#047a49;
  --violet-30:#f1ebfd;--violet-110:#6d28d9;
  --input-border:#d9e1ec;
  --shadow-card:0 1px 4px rgba(21,34,50,.08);
  --shadow-card-soft:0 2px 10px rgba(79,70,180,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter','Noto Sans JP',sans-serif;color:var(--g100);
  background:linear-gradient(160deg,#fafbff,#f1f3fc) fixed;font-size:16px;line-height:24px}
button{font:inherit;cursor:pointer}
/* 背景のダミー画面 */
.page{padding:24px 32px;display:grid;gap:16px}
.page .bar{height:56px;background:#fff;border-radius:16px;box-shadow:var(--shadow-card-soft)}
.page .ttl{font-size:28px;line-height:36px;font-weight:700}
.page .row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.page .card{height:140px;background:#fff;border-radius:16px;box-shadow:var(--shadow-card-soft)}
.overlay{position:fixed;inset:0;background:rgba(19,21,35,.5);display:flex;align-items:center;justify-content:center}

/* ---- ダイアログ共通 ---- */
.dlg{background:#fff;color:var(--g100);display:flex;flex-direction:column;max-height:calc(100vh - 2rem)}
.dlg.md{max-width:420px}.dlg.lg{max-width:640px}.dlg.xl{max-width:800px}
.hd{flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.hd .l{display:flex;align-items:center;gap:12px;min-width:0}
.ico{width:40px;height:40px;flex-shrink:0;border-radius:6px;background:var(--primary-30);color:var(--primary-100);display:flex;align-items:center;justify-content:center}
.ico svg{width:24px;height:24px}
h2{font-weight:700}
.x{margin:-8px;width:40px;height:40px;flex-shrink:0;border:0;background:none;border-radius:4px;color:var(--g80);display:flex;align-items:center;justify-content:center}
.x svg{width:24px;height:24px}
.bd{min-height:0;flex:1;overflow-y:auto;color:var(--g80);font-size:16px;line-height:24px}
.ft .in{display:flex;gap:12px}
.btn{height:40px;padding:0 16px;border-radius:8px;font-size:14px;line-height:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.out{background:#fff;border:1px solid var(--g50);color:var(--g100)}
.btn.pri{background:var(--primary-100);border:0;color:#fff}
.btn.dng{background:var(--danger-100);border:0;color:#fff}

/* ---- 案 ②: default 系(radius 6 / shadow-card / padding 28 / 題 20 / Header↔Body 16 / 外余白 16) ---- */
.dlg.B{width:calc(100% - 2rem);border-radius:6px;box-shadow:var(--shadow-card)}
.B .hd{padding:20px 20px 0}
.B h2{font-size:20px;line-height:28px}
.B .desc{margin-top:4px;font-size:14px;line-height:20px;color:var(--g80)}
.B .sub{margin-top:4px}
.B .bd{margin-top:16px;padding:0 20px}
.B .ft{margin-top:24px;flex-shrink:0;border-top:1px solid var(--g40);padding:16px 20px}
.B .ft .in{flex-wrap:wrap;justify-content:flex-end}
@media (min-width:640px){
  .B .hd{padding:28px 28px 0}.B .bd{padding:0 28px}.B .ft{padding:16px 28px}
}

/* ---- 案 ①': form 系 + md 縮小(radius 16 / shadow-card-soft / lg·xl 32・20→24・24 / md 28・20・16 / 外余白 8) ---- */
.dlg.A{width:calc(100% - 1rem);border-radius:16px;box-shadow:var(--shadow-card-soft)}
.A .hd{padding:20px 20px 0}
.A h2{font-size:20px;line-height:28px}
.A .desc{margin-top:8px;font-size:14px;line-height:20px;color:var(--g80)}
.A .sub{margin-top:4px}
.A .bd{margin-top:24px;padding:0 20px}
.A.md .bd{margin-top:16px}
.A .ft{flex-shrink:0;padding:24px 20px 20px}
.A .ft .in{display:grid;grid-template-columns:1fr 1fr}
.A .ft .in.one{grid-template-columns:1fr}
.A .ft .in.many{display:flex;flex-wrap:wrap;justify-content:flex-end}
@media (min-width:640px){
  .dlg.A{width:calc(100% - 2rem)}
  .A .hd{padding:32px 32px 0}.A h2{font-size:24px;line-height:34px}
  .A .desc{font-size:16px;line-height:24px}
  .A .bd{padding:0 32px}
  .A .ft{padding:24px 32px 32px}
  .A .ft .in,.A .ft .in.one,.A .ft .in.many{display:flex;justify-content:flex-end;border-top:1px solid var(--g40);padding-top:20px}
  /* md: padding 28 / 題 20 / Header↔Body 16 */
  .A.md .hd{padding:28px 28px 0}.A.md h2{font-size:20px;line-height:28px}
  .A.md .bd{padding:0 28px}.A.md .ft{padding:24px 28px 28px}
}

/* ---- 部品 ---- */
.cfm{color:var(--g100);overflow-wrap:anywhere}
.notice{display:flex;align-items:flex-start;gap:12px;border-radius:12px;padding:12px 20px;font-size:14px;line-height:20px;color:var(--g100);background:var(--primary-30)}
.notice.warn{background:var(--warning-30)}
.notice svg{width:24px;height:24px;flex-shrink:0}
.notice.info svg{color:var(--primary-100)}.notice.warn svg{color:var(--warning-110)}
.notice b{font-weight:500}
.cfm-wrap{display:flex;flex-direction:column;gap:8px}
.form{display:flex;flex-direction:column;gap:20px}
@media (min-width:640px){.form{gap:24px}}
.lbl{display:block;margin-bottom:4px;font-size:14px;line-height:20px;font-weight:500;color:var(--g80)}
.req{margin-left:4px;font-weight:700;color:var(--danger-100)}
.inp{position:relative}
.inp .f{height:48px;width:100%;border-radius:8px;border:1px solid var(--input-border);background:#fff;padding:0 16px;font-size:16px;line-height:24px;color:var(--g100);display:flex;align-items:center}
.inp.ic .f{padding-left:44px}
.inp .f.ph{color:var(--g70)}
.inp .lead{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--g70)}
.inp .lead svg,.inp .trail svg{width:20px;height:20px;display:block}
.inp .trail{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--g70)}
.inp.ta .f{height:auto;min-height:112px;align-items:flex-start;padding-top:12px}
.inp.ta .lead{top:12px;transform:none}
.hint{margin-top:4px;font-size:12px;line-height:16px;color:var(--g80)}
.cnt{margin-top:8px;text-align:right;font-size:14px;line-height:20px;color:var(--g80);font-variant-numeric:tabular-nums}
.dt{overflow:hidden;border-radius:6px;border:1px solid var(--g40)}
.dt>div{display:grid;grid-template-columns:6rem 1fr;border-bottom:1px solid var(--g40)}
.dt>div:last-child{border-bottom:0}
.dt dt,.dt dd{padding:12px;font-size:14px;line-height:20px;overflow-wrap:anywhere}
.dt dt{background:var(--g30);font-weight:500;color:var(--g80)}
.dt dd{background:#fff;color:var(--g100)}
@media (min-width:640px){.dt>div{grid-template-columns:10rem 1fr}.dt dt,.dt dd{padding:12px 20px}}
.badge{display:inline-flex;height:24px;align-items:center;gap:4px;border-radius:4px;padding:0 8px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.b-info{background:var(--primary-30);color:var(--primary-100)}
.b-caution{background:var(--warning-30);color:var(--warning-110)}
.b-violet{background:var(--violet-30);color:var(--violet-110)}
.b-neutral{background:var(--g40);color:var(--g80)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.toolbar p{font-size:14px;line-height:20px;color:var(--g80)}
.toolbar p b{font-size:20px;line-height:28px;font-weight:700;color:var(--g100)}
.search{position:relative;width:256px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--g70)}
.search .f{height:44px;border-radius:8px;border:1px solid var(--input-border);padding:0 16px 0 40px;display:flex;align-items:center;font-size:14px;line-height:20px;color:var(--g70)}
table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;margin-top:12px}
th{height:44px;border-bottom:2px solid var(--g40);padding:0 8px;text-align:left;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;color:var(--g80)}
td{height:52px;border-bottom:1px solid var(--g40);padding:0 8px;font-size:14px;line-height:20px;color:var(--g100)}
td.n{font-variant-numeric:tabular-nums}td.b{font-weight:700}
td .mail{display:flex;align-items:center;gap:8px}
td .mail svg{width:16px;height:16px;flex-shrink:0;color:var(--g80)}
td .mail span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td .chev{width:20px;height:20px;color:var(--g60);display:inline-block}
td .dep{display:block}td .dep .badge{max-width:100%}td .dep .badge span{overflow:hidden;text-overflow:ellipsis}
.pg{margin-top:16px;display:flex;align-items:center;justify-content:space-between;flex-direction:row}
.pg p{font-size:14px;line-height:20px;color:var(--g80)}
.pg ul{list-style:none;display:flex;gap:4px}
.pg li{min-width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--g100)}
.pg li.cur{background:var(--primary-100);color:#fff;font-weight:700}
.pg li.dis{color:var(--g60)}

.ft-tbl{overflow:hidden;border-radius:6px;border:1px solid var(--g40)}
.ft-row{display:grid;grid-template-columns:1fr;border-bottom:1px solid var(--g40)}
.ft-row:last-child{border-bottom:0}
.ft-l{background:var(--g30);padding:8px 12px;font-size:14px;line-height:20px;font-weight:500;color:var(--g80)}
.ft-v{background:#fff;padding:12px;min-width:0}
@media (min-width:640px){
  .ft-row{grid-template-columns:10rem 1fr}
  .ft-l{padding:26px 20px 12px}.ft-v{padding:12px 20px}
}
.ro-text{min-height:48px;display:flex;align-items:center;font-size:16px;line-height:24px;color:var(--g100);overflow-wrap:anywhere}
.f.dis{background:var(--g30);color:var(--g80);cursor:not-allowed}
.f.val{color:var(--g100)}
.summary{border-radius:12px;background:var(--g30);padding:16px 20px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;line-height:20px}
.summary dt{color:var(--g80)}.summary dd{color:var(--g100);overflow-wrap:anywhere}
.stack{display:flex;flex-direction:column;gap:24px}
.inp.ta .f.val{align-items:flex-start}
.mt{margin-top:0}
/* ①' lg: padding 32 / 題 24 / Header↔Body 24。タイトル左のアイコン + 説明文 */

.btn.fill{background:var(--g30);border:1px solid var(--g50);color:var(--g100)}
.btn.txt{background:none;border:0;color:var(--primary-100);font-weight:500}
</style></head><body>
<div class="page"><div class="bar"></div><div class="ttl">部署管理</div><div class="row"><div class="card"></div><div class="card"></div><div class="card"></div></div><div class="card" style="height:260px"></div></div>
<div class="overlay"><div class="dlg A lg" role="dialog">
  <div class="hd"><div class="l"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4h10v17M14 9h6v12M8 8h2M8 12h2M8 16h2"/><path d="M2 21h20"/></svg></span><div style="min-width:0"><h2>部署登録</h2><div class="desc">新しい部署情報を登録します。</div></div></div><button class="x" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
  <div class="bd"><div class="stack"><div class="ft-tbl">
      <div class="ft-row"><div class="ft-l">部署コード<span class="req">*</span></div><div class="ft-v"><div class="inp "><div class="f ph">例: DEV</div></div><p class="hint">半角英数字とハイフン、20文字以内</p></div></div>
      <div class="ft-row"><div class="ft-l">部署名<span class="req">*</span></div><div class="ft-v"><div class="inp ic"><span class="lead"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4h10v17M14 9h6v12M8 8h2M8 12h2M8 16h2"/><path d="M2 21h20"/></svg></span><div class="f ph">部署名を入力してください</div></div></div></div>
      <div class="ft-row"><div class="ft-l">部署責任者</div><div class="ft-v"><div class="inp ic"><span class="lead"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><div class="f ph">部署責任者を選択してください</div><span class="trail"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></div></div></div>
      <div class="ft-row"><div class="ft-l">説明</div><div class="ft-v"><div class="inp ic ta"><span class="lead"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span><div class="f ph">部署の役割や業務内容などを入力してください（任意）</div></div><p class="cnt">0 / 500</p></div></div>
    </div><div class="notice info"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10.5"/><path d="M12 11v5.5M12 7.5v.01"/></svg><div><b>社員は1つの部署にのみ所属します。部署の階層構造は使用しません。</b></div></div></div></div>
  <div class="ft"><div class="in"><button class="btn fill">キャンセル</button><button class="btn pri">登録</button></div></div>
</div></div></body></html>
